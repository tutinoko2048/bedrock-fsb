<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fsb2wav</title>
    <meta
      name="description"
      content="Minecraft 統合版の .fsb を WAV に変換。ブラウザ内で変換し、ファイルはアップロードされません。フォルダごとの変換と ZIP での一括ダウンロードに対応。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bedrock-fsb.retomc.dev/" />
    <meta property="og:title" content="fsb2wav" />
    <meta
      property="og:description"
      content="Minecraft 統合版の .fsb を WAV に変換。ブラウザ内で変換し、ファイルはアップロードされません。"
    />
    <meta property="og:image" content="https://bedrock-fsb.retomc.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main>
      <h1>fsb2wav</h1>
      <p class="lead">
        Minecraft 統合版の <code>.fsb</code> を WAV
        に変換します。変換はブラウザ内で行い、ファイルはどこにも送信されません。
      </p>

      <section id="drop">
        <p>.fsb ファイルやフォルダをここにドロップ</p>
        <div class="pickers">
          <label class="button"
            >ファイルを選択<input id="files" type="file" accept=".fsb" multiple hidden
          /></label>
          <label class="button"
            >フォルダを選択<input id="dir" type="file" webkitdirectory hidden
          /></label>
        </div>
      </section>

      <div class="toolbar">
        <span id="status"></span>
        <button id="zip" disabled>まとめて ZIP でダウンロード</button>
        <button id="clear" disabled>クリア</button>
      </div>

      <table>
        <tbody id="list"></tbody>
      </table>

      <footer>
        <a href="https://github.com/tutinoko2048/bedrock-fsb">bedrock-fsb</a> · FADPCM / GCADPCM / PCM16
        のみ対応
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
